# ---------------------------------------------------------------------------
# Render Blueprint — CampusOS
# ---------------------------------------------------------------------------
# One click creates:
#   campusos       Next.js web service (Node 22)
#   campusos-jobs  cron job that drives scheduled work every 10 minutes
#   campusos-db    PostgreSQL 16 (Render Postgres)
#
# No secret values live in this file:
#   - DATABASE_URL is wired from the database Render creates.
#   - AUTH_SECRET and CRON_SECRET are generated by Render on first deploy.
#   - Every third-party credential is `sync: false`: Render asks for it in the
#     dashboard (leave it blank to keep that integration off).
#
# The app boots with no optional credentials: AI runs offline, email/SMS/push
# are off and uploads are disabled until you configure a provider.
#
# Migrations run in preDeployCommand, before the new release takes traffic;
# /api/health returns 503 until the database is reachable and fully migrated.
#
# Using Supabase instead of Render Postgres: delete the `databases` block and
# replace the DATABASE_URL entry with `sync: false`, then paste the Supabase
# SESSION pooler URL (port 5432). See docs/DEPLOYMENT.md.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: campusos
    runtime: node
    plan: starter          # preDeployCommand needs a paid instance type
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # deploy a commit only after GitHub CI passes
    envVars:
      # --- Runtime -----------------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: LOG_LEVEL
        value: info

      # --- Database (required) -------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: campusos-db
          property: connectionString
      - key: DATABASE_SSL
        value: require       # TLS; Render and Supabase both support it
      - key: DB_POOL_MAX
        value: "10"

      # --- Security (required; generated, never typed) -------------------------
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE
        value: "28800"
      - key: DEMO_MODE
        value: "false"
      - key: SELF_REGISTRATION_ENABLED
        value: "true"        # students may sign up without a college (private workspace)
      - key: TRUST_PROXY
        value: "true"        # Render terminates TLS in front of Node
      - key: TRUSTED_PROXY_HOPS
        value: "1"           # 2 if Cloudflare sits in front of Render

      # --- Public URL ------------------------------------------------------------
      # Optional on Render: when blank, RENDER_EXTERNAL_URL
      # (https://<service>.onrender.com) is used. Set it for a custom domain.
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_TIMEZONE
        value: Asia/Kolkata  # read at build time

      # --- AI (optional; offline assistant by default) -----------------------------
      - key: AI_PROVIDER
        value: local         # "anthropic" + ANTHROPIC_API_KEY for the LLM
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MONTHLY_BUDGET_USD
        value: "50"
      - key: AI_USER_HOURLY_LIMIT
        value: "30"

      # --- File storage (optional; uploads off by default) ---------------------------
      - key: STORAGE_PROVIDER
        value: none          # "s3" or "supabase" + STORAGE_* to enable uploads
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_MAX_FILE_MB
        value: "20"
      - key: MALWARE_SCANNER
        value: signature

      # --- Email (optional) ------------------------------------------------------------
      - key: EMAIL_PROVIDER
        value: none          # "resend" + RESEND_API_KEY + EMAIL_FROM
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- Push / SMS / WhatsApp (optional) --------------------------------------------
      - key: PUSH_PROVIDER
        value: none          # "fcm" + FCM_*
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: SMS_PROVIDER
        value: none          # "msg91" + MSG91_*
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: WHATSAPP_PROVIDER
        value: none

      # --- Error reporting (optional) --------------------------------------------------
      - key: ERROR_REPORTER
        value: none          # "webhook" + ERROR_WEBHOOK_URL
      - key: ERROR_WEBHOOK_URL
        sync: false

      # --- Career Mode opportunities feed (optional) -----------------------------------
      - key: OPPORTUNITY_FEED_PROVIDER
        value: none          # "json-feed" + OPPORTUNITY_FEED_URL
      - key: OPPORTUNITY_FEED_URL
        sync: false
      - key: OPPORTUNITY_FEED_TOKEN
        sync: false

  - type: cron
    name: campusos-jobs
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/10 * * * *"
    buildCommand: "true"
    # Calls the web service over Render's private network; APP_URL, if set,
    # takes precedence (e.g. when the web service lives elsewhere).
    startCommand: >-
      curl -fsS --max-time 120 -X POST "${APP_URL:-http://$CAMPUSOS_HOSTPORT}/api/jobs/run"
      -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d '{}'
    envVars:
      - key: CAMPUSOS_HOSTPORT
        fromService:
          type: web
          name: campusos
          property: hostport
      - key: CRON_SECRET
        fromService:
          type: web
          name: campusos
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false

databases:
  - name: campusos-db
    databaseName: campusos
    user: campusos
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []        # internal connections only; no public access
