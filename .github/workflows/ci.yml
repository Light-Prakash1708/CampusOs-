name: CI

# Validation only — never deploys. Deployment is .github/workflows/deploy.yml
# (or Render's own auto-deploy, which waits for these checks to pass).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos
      AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      APP_URL: http://localhost:3000
      DEMO_PASSWORD: CampusOS!Demo2026
      AI_PROVIDER: local
      EMAIL_PROVIDER: console
      STORAGE_PROVIDER: local
      CRON_SECRET: ci-cron-secret-000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Whitespace / conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migrate (fresh database)
        run: npm run db:migrate
      - name: Migrations are idempotent
        run: npm run db:migrate
      - name: Schema matches migrations (no un-generated changes)
        run: npx drizzle-kit check && npx drizzle-kit generate --name ci-drift-check | tee /tmp/drift.txt && ! grep -q "Your SQL migration file" /tmp/drift.txt
      - name: Seed
        run: npm run db:seed
      - name: Test
        run: npm test
      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        run: npm run build


  e2e:
    # Core pilot flows in a real browser against a production build (CAMPUSOS-009).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos
      AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      APP_URL: http://localhost:3000
      DEMO_PASSWORD: CampusOS!Demo2026
      AI_PROVIDER: local
      EMAIL_PROVIDER: console
      STORAGE_PROVIDER: local
      ALLOW_LOCAL_STORAGE: 'true'
      SELF_REGISTRATION_ENABLED: 'true'
      CRON_SECRET: ci-cron-secret-000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency advisories (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
