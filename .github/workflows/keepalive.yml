name: Keep-alive

# The production database is a free Supabase project, which Supabase pauses
# after about a week without activity (CampusOS then cannot boot). Twice a day
# this calls /api/health, which queries the database. It deliberately does NOT
# keep the free Render instance awake around the clock (that would use up the
# workspace's free instance hours); the first request simply wakes it.
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_URL: https://campusos-aj2v.onrender.com/api/health
    steps:
      - name: Call the health endpoint (allows for a cold start)
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 90 "$HEALTH_URL" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then cat body.json; exit 0; fi
            sleep 20
          done
          echo "::error::CampusOS health check did not return 200"
          cat body.json 2>/dev/null || true
          exit 1
